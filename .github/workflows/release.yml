name: Release

on:
    push:
        tags:
            - "[0-9]+.[0-9]+.[0-9]+"
    # Manual release: creates the tag on the selected branch's head.
    workflow_dispatch:
        inputs:
            version:
                description: "Version to release (X.Y.Z), tagged on the selected branch"
                required: true

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        env:
            VERSION: ${{ inputs.version || github.ref_name }}
        steps:
            - name: Check the version
              run: |
                  [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid version: $VERSION"; exit 1; }

            - uses: actions/checkout@v4

            - name: "Set version number"
              run: |
                  yq -i -o json '.version="${{ env.VERSION }}"' \
                  "${{ github.workspace }}/custom_components/vtherm_inhibition/manifest.json"

            - name: Create ZIP
              run: |
                  cd custom_components/vtherm_inhibition
                  zip -r ../../vtherm_inhibition.zip .

            - name: Create Release
              uses: softprops/action-gh-release@v2.2.1
              with:
                  tag_name: ${{ env.VERSION }}
                  target_commitish: ${{ github.sha }}
                  name: Release ${{ env.VERSION }}
                  draft: false
                  prerelease: false
                  generate_release_notes: true
                  files: vtherm_inhibition.zip
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
