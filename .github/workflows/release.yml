name: Release

# A release is published, with its tag, when:
# - the version in manifest.json changes on main to a version without a tag yet,
# - a tag X.Y.Z is pushed,
# - "Run workflow" is started with a version (tagged on the selected branch's head).

on:
    push:
        branches:
            - main
        paths:
            - custom_components/vtherm_inhibition/manifest.json
            - .github/workflows/release.yml
        tags:
            - "[0-9]+.[0-9]+.[0-9]+"
    workflow_dispatch:
        inputs:
            version:
                description: "Version to release (X.Y.Z), tagged on the selected branch"
                required: true

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Determine the version
              id: version
              env:
                  INPUT_VERSION: ${{ inputs.version }}
              run: |
                  if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
                      version="$INPUT_VERSION"
                  elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
                      version="$GITHUB_REF_NAME"
                  else
                      version="$(jq -r .version custom_components/vtherm_inhibition/manifest.json)"
                  fi
                  [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid version: $version"; exit 1; }
                  skip=false
                  if [[ "$GITHUB_REF_TYPE" == "branch" && "$GITHUB_EVENT_NAME" == "push" ]] \
                      && git ls-remote --exit-code --tags origin "refs/tags/$version" > /dev/null; then
                      echo "Version $version is already released, nothing to do"
                      skip=true
                  fi
                  echo "version=$version" >> "$GITHUB_OUTPUT"
                  echo "skip=$skip" >> "$GITHUB_OUTPUT"

            - name: Set version number
              if: steps.version.outputs.skip == 'false'
              run: |
                  yq -i -o json '.version="${{ steps.version.outputs.version }}"' \
                  "${{ github.workspace }}/custom_components/vtherm_inhibition/manifest.json"

            - name: Create ZIP
              if: steps.version.outputs.skip == 'false'
              run: |
                  cd custom_components/vtherm_inhibition
                  zip -r ../../vtherm_inhibition.zip .

            - name: Create Release
              if: steps.version.outputs.skip == 'false'
              uses: softprops/action-gh-release@v2.2.1
              with:
                  tag_name: ${{ steps.version.outputs.version }}
                  target_commitish: ${{ github.sha }}
                  name: Release ${{ steps.version.outputs.version }}
                  draft: false
                  prerelease: false
                  generate_release_notes: true
                  files: vtherm_inhibition.zip
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
