name: Run Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  testu:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.14

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements_test.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # vtherm_api 0.6.2 is not on PyPI yet: fall back to its branch (remove once published)
          pip3 install -r requirements_test.txt || (pip3 install "git+https://github.com/alexlenk/vtherm_api@feat/2087-inhibition-started" && pip3 install -r requirements_test.txt)

      - name: Run Tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest \
            -qq \
            --timeout=9 \
            --durations=10 \
            -n auto \
            -o console_output_style=count \
            -p no:sugar \
            tests

      - name: Coverage
        if: false
        run: |
          coverage run -m pytest tests/
          coverage report

      - name: Generate HTML Coverage Report
        if: false
        run: coverage html
